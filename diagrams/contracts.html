<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract boundaries</title>
<style>
body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; }
.diagram-container { width: 100%; overflow-x: auto; }

<body><main><div class="diagram-container">
<svg viewBox="0 0 960 600" role="img" aria-labelledby="contracts-title contracts-desc" xmlns="http://www.w3.org/2000/svg">
<title id="contracts-title">Contract boundaries</title>
<desc id="contracts-desc">The database schema and backend must agree; the backend exposes an API contract consumed by web and Flutter clients. Generated types alone do not prove runtime behavior or compatibility with an installed client.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="76" fill="#4f5d75" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2">SHARED INTERFACES</text>
<text x="40" y="124" fill="#2d3142" font-family="Georgia, serif" font-size="36">Contracts cross boundaries</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M208 268 H264" marker-start="url(#arrow)"/>
<path d="M428 268 H484"/>
<path d="M648 252 H704 Q712 252 712 244 V216 Q712 208 720 208 H752"/>
<path d="M648 284 H704 Q712 284 712 292 V320 Q712 328 720 328 H752"/>
</g>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">
<rect x="40" y="232" width="168" height="72" rx="6" fill="#ececec" stroke="#4f5d75"/><text x="124" y="274">Database schema</text>
<rect x="264" y="232" width="164" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="346" y="274">Backend</text>
<rect x="484" y="232" width="164" height="72" rx="6" fill="#f9ebe6" stroke="#bf4520" stroke-width="1.5"/><text x="566" y="274">API contract</text>
<rect x="752" y="172" width="168" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="836" y="214">Web</text>
<rect x="752" y="292" width="168" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="836" y="334">Flutter</text>
</g>
<line x1="40" y1="420" x2="920" y2="420" stroke="#bfc0c0"/>
<text x="40" y="462" fill="#bf4520" font-family="Georgia, serif" font-size="22" font-style="italic">Generated types are not proof of compatibility.</text>
<text x="40" y="495" fill="#4f5d75" font-family="system-ui, sans-serif" font-size="15">Runtime behavior and installed client versions still need verification.</text>
</svg>
</div></main></body></html>
