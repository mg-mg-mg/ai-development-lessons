<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="delivery-title delivery-desc" xmlns="http://www.w3.org/2000/svg" id="delivery-root">
<title id="delivery-title">Delivery process</title>
<desc id="delivery-desc">An issue moves through implementation, mechanical checks, independent review, merge, and deploy verification; requested revisions return to implementation and do not constitute approval.</desc>
<defs>
      <style>#delivery-root { color: #2d3142; font-family: system-ui, sans-serif; }
      #delivery-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#delivery-root .diagram-container { overflow-x: visible; }
}</style><marker id="delivery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="76" fill="#4f5d75" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2">THE DELIVERY PATH</text>
<text x="40" y="124" fill="#2d3142" font-family="Georgia, serif" font-size="36">From issue to verified deployment</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#delivery-arrow)">
<path d="M164 216 H188"/><path d="M312 216 H336"/><path d="M460 216 H484"/><path d="M608 216 H632"/><path d="M756 216 H780"/>
<path d="M546 252 V324 Q546 332 538 332 H258 Q250 332 250 324 V252" stroke-dasharray="6 5"/>
</g>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600">
<rect x="40" y="180" width="124" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="102" y="222">Issue</text>
<rect x="188" y="180" width="124" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="250" y="222">Implementation</text>
<rect x="336" y="180" width="124" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="398" y="211"><tspan x="398">Mechanical</tspan><tspan x="398" dy="20">checks</tspan></text>
<rect x="484" y="180" width="124" height="72" rx="6" fill="#f9ebe6" stroke="#bf4520" stroke-width="1.5"/><text x="546" y="211"><tspan x="546">Independent</tspan><tspan x="546" dy="20">review</tspan></text>
<rect x="632" y="180" width="124" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="694" y="222">Merge</text>
<rect x="780" y="180" width="124" height="72" rx="6" fill="#fff" stroke="#4f5d75"/><text x="842" y="211"><tspan x="842">Deploy</tspan><tspan x="842" dy="20">verification</tspan></text>
</g>
<rect x="325" y="292" width="148" height="24" fill="#f5f5f5"/>
<text x="399" y="308" text-anchor="middle" fill="#4f5d75" font-family="system-ui, sans-serif" font-size="12">Changes requested</text>
<line x1="40" y1="406" x2="920" y2="406" stroke="#bfc0c0"/>
<text x="40" y="447" fill="#bf4520" font-family="Georgia, serif" font-size="20" font-style="italic">Revision is not automatic approval.</text>
<text x="40" y="478" fill="#4f5d75" font-family="system-ui, sans-serif" font-size="14">The revised work returns through checks and independent review.</text>
</svg>
