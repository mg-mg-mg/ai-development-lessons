<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="unknown-outcome-title unknown-outcome-desc" xmlns="http://www.w3.org/2000/svg" id="unknown-outcome-root">
<title id="unknown-outcome-title">Uncertain external action</title>
<desc id="unknown-outcome-desc">After an external action has an uncertain outcome, confirmed success is recorded; if no effect is proven, retry is safe only when the provider contract permits it; if the outcome remains unknown, hold and escalate rather than retry blindly.</desc>
<defs>
      <style>#unknown-outcome-root { color: #2d3142; font-family: system-ui, sans-serif; }
      #unknown-outcome-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#unknown-outcome-root .diagram-container { overflow-x: visible; }
}</style><marker id="unknown-outcome-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="76" fill="#4f5d75" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2">EXTERNAL ACTIONS</text>
<text x="40" y="124" fill="#2d3142" font-family="Georgia, serif" font-size="36">Resolve uncertainty before acting again</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#unknown-outcome-arrow)">
<path d="M304 256 H440 Q448 256 448 248 V188 Q448 180 456 180 H624"/>
<path d="M304 280 H624"/>
<path d="M304 304 H472 Q480 304 480 312 V372 Q480 380 488 380 H624"/>
</g>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#2d3142">
<rect x="40" y="240" width="264" height="80" rx="8" fill="#f9ebe6" stroke="#bf4520" stroke-width="1.5"/>
<text x="172" y="274" font-size="16" font-weight="600">Outcome uncertain</text><text x="172" y="296" font-size="13">Find evidence before acting</text>
<rect x="624" y="144" width="296" height="72" rx="8" fill="#fff" stroke="#4f5d75"/>
<text x="772" y="174" font-size="16" font-weight="600">Confirmed success</text><text x="772" y="197" font-size="13">Record the result</text>
<rect x="624" y="244" width="296" height="72" rx="8" fill="#fff" stroke="#4f5d75"/>
<text x="772" y="274" font-size="16" font-weight="600">No effect proven</text><text x="772" y="297" font-size="13">Retry only if provider contract permits</text>
<rect x="624" y="344" width="296" height="72" rx="8" fill="#fff" stroke="#4f5d75"/>
<text x="772" y="374" font-size="16" font-weight="600">Still unknown</text><text x="772" y="397" font-size="13">Hold and escalate</text>
</g>
<g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4f5d75">
<rect x="500" y="151" width="92" height="20" fill="#f5f5f5"/><text x="546" y="166">CONFIRMED</text>
<rect x="504" y="251" width="84" height="20" fill="#f5f5f5"/><text x="546" y="266">PROVEN</text>
<rect x="500" y="351" width="104" height="20" fill="#f5f5f5"/><text x="552" y="366">UNRESOLVED</text>
</g>
<line x1="40" y1="468" x2="920" y2="468" stroke="#bfc0c0"/>
<text x="40" y="512" fill="#bf4520" font-family="Georgia, serif" font-size="22" font-style="italic">Never retry an unknown outcome blindly.</text>
</svg>
